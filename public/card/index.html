<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=https://youtu.be/u-NwCYGTUn4?si=f3NhYR1unuRmoUpx" />
    <title>Открываю видео…</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Heebo', system-ui, -apple-system, sans-serif;
        background: #000;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .wrap { text-align: center; max-width: 420px; }
      .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 28px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 {
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 28px;
        line-height: 1.3;
      }
      .btn {
        display: inline-block;
        background: #fff;
        color: #000;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        transition: background 0.3s ease;
      }
      .btn:hover { background: #e5e5e5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Открываю видео…</h1>
      <a class="btn" href="https://youtu.be/u-NwCYGTUn4?si=f3NhYR1unuRmoUpx" target="_blank" rel="noopener noreferrer">Смотреть на YouTube</a>
    </div>
    <script>
      window.location.replace('https://youtu.be/u-NwCYGTUn4?si=f3NhYR1unuRmoUpx');
    </script>
  </body>
</html>
