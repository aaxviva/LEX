<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexey Viventsov — Filmmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
      @font-face {
        font-family: 'Benzin-Bold';
        src: url('/fonts/benzin.woff2') format('woff2'),
             url('/fonts/benzin.woff') format('woff'),
             url('/fonts/benzin.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'CyGroteskGrand';
        src: url('/fonts/cy-grotesk-grand-dark.woff2') format('woff2'),
             url('/fonts/cy-grotesk-grand-dark.woff') format('woff'),
             url('/fonts/cy-grotesk-grand-dark.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: 'Heebo', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #ffffff;
        color: #111111;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }
      .card { width: 100%; max-width: 380px; }
      .name-block { display: inline-block; text-align: left; }
      .name-block-wrapper { text-align: center; margin-bottom: 44px; }
      .name {
        font-family: 'Benzin-Bold', 'Arial Black', -apple-system, sans-serif;
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: -0.025em;
        color: #111111;
      }
      .role {
        font-family: 'CyGroteskGrand', 'Arial Black', -apple-system, sans-serif;
        font-size: 7.5px;
        font-weight: bold;
        color: #111111;
        letter-spacing: 0;
        text-transform: uppercase;
        text-align: left;
        margin-top: 1px;
      }
      .btns { display: flex; flex-direction: column; gap: 14px; }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 18px 20px;
        border-radius: 999px;
        border: 1px solid #111111;
        background: #ffffff;
        font-family: 'Heebo', sans-serif;
        font-size: 17px;
        font-weight: 500;
        color: #111111;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.2s ease;
      }
      .btn:active { transform: scale(0.97); }
      .btn:hover { background: #F5F5F5; }
      .btn i { font-size: 22px; flex-shrink: 0; color: #111111; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="name-block-wrapper">
        <div class="name-block">
          <h1 class="name">Alexey Viventsov</h1>
          <p class="role">FILMMAKER</p>
        </div>
      </div>
      <div class="btns">
        <a class="btn" href="https://youtu.be/u-NwCYGTUn4?si=N5BcbwRtOgkkGBGd" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-youtube"></i>
          צפייה בסרטון
        </a>
        <a class="btn" href="https://wa.me/972542489940" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-whatsapp"></i>
          שליחת הודעה בוואטסאפ
        </a>
        <a class="btn" href="https://lexviven.com">
          <i class="fa-solid fa-globe"></i>
          לאתר
        </a>
      </div>
    </div>
  </body>
</html>
